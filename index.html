<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBuddy</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <!-- 1. TELA DE LOGIN -->
    <div id="login-page" class="auth-container">
        <div class="auth-box">
            <h2>Sign In</h2>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email-login" placeholder="Ex: arthur@email.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password-login" placeholder="••••••••">
            </div>
            <button id="btn-login" class="btn-primary">Sign In</button>
            <p class="auth-switch">New here? <span id="btn-to-register">Create account</span></p>
        </div>
    </div>

    <!-- 2. TELA DE REGISTRO (CRIAR CONTA) -->
    <div id="register-page" class="auth-container hidden">
        <div class="auth-box">
            <h2>Create Account</h2>
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email-reg" placeholder="Ex: arthur@email.com">
            </div>
            <div class="input-group">
                <label>Choose Password</label>
                <input type="password" id="password-reg" placeholder="••••••••">
            </div>
            <button id="btn-register" class="btn-primary">Continue</button>
            <p class="auth-switch">Already have an account? <span id="btn-to-login">Sign In</span></p>
        </div>
    </div>

    <!-- 3. TELA DE CONFIGURAÇÃO DE PERFIL -->
    <div id="profile-page" class="auth-container hidden">
        <div class="auth-box">
            <h2>Setup Profile</h2>
            <div class="input-group">
                <label>Display Name</label>
                <input type="text" id="display-name" placeholder="Ex: Arthur">
            </div>
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Ex: arthur123">
            </div>
            <button id="btn-save-profile" class="btn-primary">Save and Finish</button>
        </div>
    </div>

    <!-- 4. TELA PRINCIPAL DO CHAT -->
    <div id="chat-page" class="chat-container hidden">
        <!-- BARRA LATERAL (CONVERSAS) -->
        <aside class="sidebar">
            <header class="sidebar-header">
                <div class="user-profile-summary">
                    <h3 id="current-user-name">Carregando...</h3>
                    <p id="current-user-tag">@username</p>
                </div>
                <button id="btn-logout" class="btn-icon-logout">Sair</button>
            </header>
            
            <div class="search-bar">
                <input type="text" id="search-contact" placeholder="Buscar conversa...">
            </div>

            <div id="chats-list" class="chats-list">
                <!-- Injetado via JavaScript -->
            </div>

            <button id="btn-new-chat" class="btn-fab">+</button>
        </aside>

        <!-- ÁREA DA CONVERSA ATIVA -->
        <main class="chat-area">
            <header class="chat-header">
                <div class="active-user-info">
                    <h2 id="active-chat-name">Selecione uma conversa</h2>
                    <p id="active-chat-status"></p>
                </div>
            </header>

            <div id="messages-container" class="messages-container">
                <p class="chat-placeholder">Inicie um chat clicando no botão "+" abaixo.</p>
            </div>

            <footer class="chat-footer">
                <input type="text" id="message-input" placeholder="Digite uma mensagem...">
                <button id="btn-send" class="btn-send">Enviar</button>
            </footer>
        </main>
    </div>

    <!-- MODAL DE CONTATOS (CHAMADO PELO BOTÃO FAB +) -->
    <div id="contacts-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Iniciar nova conversa</h3>
                <button id="btn-close-modal" class="btn-close">&times;</button>
            </div>
            <div id="contacts-list" class="contacts-list">
                <!-- Injetado via JavaScript -->
            </div>
        </div>
    </div>

    <!-- SCRIPTS DO FIREBASE (FORMATO COMPAT) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <!-- MEU SCRIPT PRINCIPAL -->
    <script src="script.js"></script>
</body>
  </html>
